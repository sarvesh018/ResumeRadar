events {
    worker_connections 256;
}

http {
    log_format main '$remote_addr - $request - $status - $request_time s';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    upstream auth_backend       { server auth-service:8001; }
    upstream profile_backend    { server profile-service:8002; }
    upstream matcher_backend    { server matcher-service:8003; }
    upstream tracker_backend    { server tracker-service:8004; }
    upstream analytics_backend  { server analytics-service:8005; }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 10M;

        # CORS headers — must be at server level, not inside if blocks
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Correlation-ID, Origin, Accept' always;
        add_header 'Access-Control-Expose-Headers' 'X-Correlation-ID' always;

        # Handle preflight — return 204, headers already added above
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        location /api/v1/auth/ {
            proxy_pass http://auth_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/profile {
            proxy_pass http://profile_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/resumes {
            proxy_pass http://profile_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/match {
            proxy_pass http://matcher_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 30s;
        }

        location /api/v1/applications {
            proxy_pass http://tracker_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/analytics {
            proxy_pass http://analytics_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location = /health {
            default_type application/json;
            return 200 '{"status":"gateway_alive"}';
        }
    }
}
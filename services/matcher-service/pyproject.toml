[project]
name = "resumeradar-matcher"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "resumeradar-common",
    "sentence-transformers>=2.2.0",
    "rapidfuzz>=3.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "groq>=0.4.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.19.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"